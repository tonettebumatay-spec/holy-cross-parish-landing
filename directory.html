<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Directory | Holy Cross Parish</title>
    <link rel="icon" href="images/hcp-logo.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
        :root { --brown: #4c2b08; }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Poppins, sans-serif; text-decoration: none; transition: .2s linear; }
        html { font-size: 62.5%; scroll-behavior: smooth; scroll-padding-top: 6rem; overflow-x: hidden; }

        @media (max-width: 768px) { html { font-size: 50%; } }
        @media (max-width: 450px) { html { font-size: 45%; } }

        body { background-color: #ffffff; }

        header { position: fixed; top: 0; left: 0; right: 0; background: var(--brown); padding: 2rem 9%; display: flex; align-items: center; justify-content: space-between; z-index: 1000; box-shadow: 0 .5rem 1rem rgba(0,0,0,.1); }
        header .logo { font-size: 3rem; color: #ffffff; font-weight: bolder; }
        header .logo span { color: #b8957f; }
        header .navbar a { font-size: 2rem; padding: 0 1.5rem; color: #ffffff; }
        header .navbar a:hover { color: #b79d8d; }
        header #toggler { display: none; }
        header .fa-bars { font-size: 3rem; color: #ffffff; border-radius: .5rem; padding: .5rem 1.5rem; cursor: pointer; border: .1rem solid rgba(255, 255, 255, 0.3); display: none; }

        @media (max-width: 991px) {
            header { padding: 2rem; }
            header .fa-bars { display: block; }
            header .navbar { position: absolute; top: 100%; left: 0; right: 0; background: #eee; border-top: .1rem solid rgba(0, 0, 0, .1); display: none; flex-direction: column; }
            header #toggler:checked ~ .navbar { display: flex; }
            header .navbar a { display: block; margin: 1.5rem; padding: 1.5rem; background: #fff; border: .1rem solid rgba(0, 0, 0, .1); color: var(--brown); font-size: 2.5rem; text-align: center; }
        }

        .directory { background-color: #f9f9f9; padding: 12rem 9% 5rem; min-height: 100vh; }
        .directory .heading { font-size: 3.5rem; text-align: center; color: #333; margin-bottom: 3rem; }
        .directory .heading span { color: #b8957f; }

        .directory .organization-container {
            width: 100%; max-width: 1200px; margin: 0 auto; padding: 1.5rem;
            background: #ffffff; border: 1px solid rgba(76, 43, 8, 0.12); border-radius: 0.8rem;
            box-shadow: 0 0.5rem 1.5rem rgba(0, 0, 0, 0.08); overflow-x: auto; /* Pina-zoom/scroll sa mobile */
        }

        /* FIX: Para maview ng maayos yung malaking organizational chart sa phone */
        .directory .organization-container img {
            display: block; width: 100%; height: auto; object-fit: contain; border-radius: 0.4rem;
            min-width: 600px; /* Pwede i-scroll pakaliwa o pakanan sa phone */
        }

        @media (max-width: 768px) {
            .directory { padding: 10rem 4% 4rem; }
            .directory .heading { font-size: 2.7rem; margin-bottom: 2rem; }
            .directory .organization-container { padding: 0.7rem; }
        }

        footer { padding: 2rem 7%; text-align: center; background: var(--brown); color: #ffffff; font-size: 1.4rem; margin-top: 5rem; }
    </style>
</head>
<body>
    <header>
        <input type="checkbox" name="" id="toggler">
        <label for="toggler" class="fa fa-bars"></label>
        <a href="index.html" class="logo">Holy Cross Parish<span>.</span></a>
        <nav class="navbar">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="news.html">News &amp; Updates</a>
            <a href="directory.html">Directory</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <section class="directory" id="directory">
        <h1 class="heading"><span>Holy Cross Parish</span> Directory</h1>
        <div class="organization-container">
            <img src="images/hcp-organizational-chart.png" alt="Holy Cross Parish Organizational Chart" loading="lazy">
        </div>
    </section>

    <footer><p>&copy; <span id="year">2026</span> Holy Cross Parish. All Rights Reserved.</p></footer>
    <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
